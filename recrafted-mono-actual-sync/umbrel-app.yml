manifestVersion: 1
id: "recrafted-mono-actual-sync"
name: "Actual-Mono"
tagline: "Sync transactions from Monobank into Actual Budget"
category: "finance"
version: "1.0.0"
port: 9191
description: >-
  Self-hosted web application that bridges Ukrainian Monobank accounts directly
  into your Actual Budget server.

  Original author: sviatcraft (https://github.com/sviatcraft/mono-actual-sync).
  Forked and enhanced by reCrafted AI / denysochek.

  Features:
  - Simple, modern Web UI
  - Real-time and manual sync (last 7/14/30/90 days, by month, or custom date range)
  - Automatic scheduled background sync (node-cron)
  - Multi-card mapping (supports personal cards, cashback, jars, and FOP accounts)
  - Full support for the latest Actual Budget (26.x)
  - Bilingual UI with Ukrainian (Українська) and English language support
